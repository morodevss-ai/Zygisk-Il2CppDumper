name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Build module
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          chmod +x ./gradlew

          sed -i "s|moduleDescription = \"|moduleDescription = \"(${PACKAGE_NAME}) |" module.gradle

          sed -i "s|com.game.packagename|${PACKAGE_NAME}|g" module/src/main/cpp/game.h

          ./gradlew :module:assembleRelease

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper
          path: out/magisk_module_release/
          if-no-files-found: error
